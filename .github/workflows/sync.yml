name: Sync Coros
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: coros-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python scripts/sync_coros.py
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          COROS_REGION: ${{ secrets.COROS_REGION }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
      - run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/workouts.enc
          git diff --cached --quiet || (git commit -m "Update workouts" && git push)
